apply plugin: 'com.android.application'

android {
    namespace 'org.nightlock'
    compileSdk 33

    defaultConfig {
        applicationId "org.nightlock"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}